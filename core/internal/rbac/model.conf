[request_definition]
r = sub, dom, obj, act

[policy_definition]
p = sub, obj, act

[role_definition]
g = _, _, _
g2 = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
# Support wildcards (*) in matcher
# 1. Project role match: g(user, role, project_id) && role has permission
# 2. Platform role match: g2(user, role) && role has permission (ignore domain)
# 3. Wildcard support: p.obj == "*" || p.act == "*" allows all
m = (g(r.sub, p.sub, r.dom) || g2(r.sub, p.sub)) && (p.obj == "*" || r.obj == p.obj) && (p.act == "*" || r.act == p.act)
