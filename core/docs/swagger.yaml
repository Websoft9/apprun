definitions:
  config.GetConfigResponse:
    properties:
      is_dynamic:
        description: Whether it's a dynamic configuration
        example: false
        type: boolean
      key:
        description: Configuration key
        example: app.name
        type: string
      source:
        description: 'Source: "database", "file", "env", "default"'
        example: default
        type: string
      value:
        description: Configuration value
        example: apprun
        type: string
    type: object
  config.ListConfigsResponse:
    properties:
      configs:
        additionalProperties:
          type: string
        description: Key-value mapping of dynamic configurations
        type: object
      count:
        description: Number of configuration items
        example: 3
        type: integer
    type: object
  config.UpdateConfigRequest:
    properties:
      key:
        description: Configuration key
        example: poc.enabled
        type: string
      value:
        description: New value
        example: "true"
        type: string
    required:
    - key
    - value
    type: object
  config.UpdateConfigResponse:
    properties:
      key:
        example: poc.enabled
        type: string
      value:
        example: "true"
        type: string
    type: object
  handlers.HealthResponse:
    properties:
      service:
        example: apprun
        type: string
      status:
        example: ok
        type: string
    type: object
  response.ErrorInfo:
    properties:
      code:
        type: string
      details: {}
      message:
        type: string
    type: object
  response.Response:
    properties:
      code:
        type: integer
      data: {}
      error:
        $ref: '#/definitions/response.ErrorInfo'
      message:
        type: string
      request_id:
        type: string
      success:
        type: boolean
    type: object
  service.LoginRequest:
    properties:
      identifier:
        description: Username or email
        example: user@example.com
        type: string
      password:
        description: Password
        example: SecurePass123
        type: string
    required:
    - identifier
    - password
    type: object
  service.LoginResponse:
    properties:
      expires_at:
        description: Token expiration time (ISO 8601)
        type: string
      token:
        description: JWT access token
        type: string
      user:
        allOf:
        - $ref: '#/definitions/service.UserProfile'
        description: User profile data
    type: object
  service.RegisterRequest:
    properties:
      email:
        description: 用户邮箱（必填）
        example: user@example.com
        type: string
      gender:
        description: 性别（可选：0=未知,1=男,2=女）
        example: 1
        type: integer
      language:
        description: 语言（可选）
        example: zh-CN
        type: string
      nickname:
        description: 昵称（可选）
        example: John
        type: string
      password:
        description: 密码（必填，8+字符，含大小写和数字）
        example: SecurePass123
        type: string
      phone:
        description: 手机号（可选）
        example: +86-13800138000
        type: string
      timezone:
        description: 时区（可选）
        example: Asia/Shanghai
        type: string
      username:
        description: 用户名（可选，3-64字符）
        example: john_doe
        type: string
    required:
    - email
    - password
    type: object
  service.RegisterResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        description: Public UUID (exposed as "id" for external API)
        type: string
      nickname:
        type: string
      status:
        type: integer
      username:
        type: string
    type: object
  service.UserProfile:
    properties:
      created_at:
        type: string
      email:
        type: string
      gender:
        type: integer
      id:
        type: string
      language:
        type: string
      nickname:
        type: string
      phone:
        type: string
      status:
        type: integer
      timezone:
        type: string
      username:
        type: string
    type: object
info:
  contact:
    email: support@websoft9.com
    name: API Support
  description: AppRun Platform REST API Documentation
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: AppRun API
  version: "1.0"
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return JWT token
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.LoginResponse'
              type: object
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Account disabled
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.Response'
      summary: User login
      tags:
      - auth
  /api/auth/me:
    get:
      consumes:
      - application/json
      description: Retrieve profile of the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.UserProfile'
              type: object
        "401":
          description: Missing or invalid token
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Get current user profile
      tags:
      - auth
  /api/auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account with email and password
      parameters:
      - description: Registration data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.RegisterResponse'
              type: object
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/response.Response'
        "409":
          description: Email or username already exists
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.Response'
      summary: Register new user
      tags:
      - auth
  /api/config:
    delete:
      consumes:
      - application/json
      description: |-
        Delete a dynamic configuration item from database (config will fallback to file or default value).
        Only dynamic configurations (db:true) can be deleted.
        After deletion, the config will use the value from config files or built-in defaults.
      parameters:
      - description: Configuration key
        example: poc.enabled
        in: query
        name: key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Deletion successful
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Missing key parameter or deletion failed
          schema:
            $ref: '#/definitions/response.Response'
      summary: Delete configuration item
      tags:
      - config
    get:
      consumes:
      - application/json
      description: Query a single configuration item by key, returns value, source
        and dynamic flag
      parameters:
      - description: Configuration key, e.g. app.name
        in: query
        name: key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Configuration retrieved successfully
          schema:
            $ref: '#/definitions/config.GetConfigResponse'
        "400":
          description: Missing key parameter
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Configuration not found
          schema:
            $ref: '#/definitions/response.Response'
      summary: Get configuration item
      tags:
      - config
    put:
      consumes:
      - application/json
      description: |-
        Update a single dynamic configuration item (only for db:true configs).
        Static configurations (db:false) cannot be updated via API.
        Changes are persisted to database and take effect immediately.
      parameters:
      - description: Configuration update request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/config.UpdateConfigRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Configuration updated successfully
          schema:
            $ref: '#/definitions/config.UpdateConfigResponse'
        "400":
          description: Invalid request or config not allowed to store in database
          schema:
            $ref: '#/definitions/response.Response'
      summary: Update configuration item
      tags:
      - config
  /api/config/allowed:
    get:
      consumes:
      - application/json
      description: |-
        Returns all configuration keys marked as db:true (can be modified dynamically via API).
        Use this endpoint to discover which configs can be updated through the API.
        Configs not in this list cannot be modified dynamically.
      produces:
      - application/json
      responses:
        "200":
          description: List of allowed configuration keys
          schema:
            additionalProperties: true
            type: object
      summary: Get allowed configuration keys
      tags:
      - config
  /api/config/list:
    get:
      consumes:
      - application/json
      description: |-
        Returns all dynamic configuration items stored in database.
        This does not include static configurations from files.
        Use this to see which configs have been overridden dynamically.
      produces:
      - application/json
      responses:
        "200":
          description: Configuration list
          schema:
            $ref: '#/definitions/config.ListConfigsResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.Response'
      summary: List dynamic configurations
      tags:
      - config
  /api/demo/i18n:
    get:
      description: Demonstrates internationalization with context-based translation
      parameters:
      - description: Language code (en-US, zh-CN)
        in: query
        name: lang
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  additionalProperties:
                    type: string
                  type: object
              type: object
      summary: i18n Demo
      tags:
      - demo
  /health:
    get:
      description: Check if the service is running
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.HealthResponse'
      summary: Health Check
      tags:
      - system
schemes:
- http
- https
swagger: "2.0"
