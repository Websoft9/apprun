definitions:
  config.GetConfigResponse:
    properties:
      is_dynamic:
        description: Whether it's a dynamic configuration
        example: false
        type: boolean
      key:
        description: Configuration key
        example: app.name
        type: string
      source:
        description: 'Source: "database", "file", "env", "default"'
        example: default
        type: string
      value:
        description: Configuration value
        example: apprun
        type: string
    type: object
  config.ListConfigsResponse:
    properties:
      configs:
        additionalProperties:
          type: string
        description: Key-value mapping of dynamic configurations
        type: object
      count:
        description: Number of configuration items
        example: 3
        type: integer
    type: object
  config.UpdateConfigRequest:
    properties:
      key:
        description: Configuration key
        example: poc.enabled
        type: string
      value:
        description: New value
        example: "true"
        type: string
    required:
    - key
    - value
    type: object
  config.UpdateConfigResponse:
    properties:
      key:
        example: poc.enabled
        type: string
      value:
        example: "true"
        type: string
    type: object
  ent.Project:
    properties:
      created_at:
        description: CreatedAt holds the value of the "created_at" field.
        type: string
      description:
        description: Description holds the value of the "description" field.
        type: string
      edges:
        allOf:
        - $ref: '#/definitions/ent.ProjectEdges'
        description: |-
          Edges holds the relations/edges for other nodes in the graph.
          The values are being populated by the ProjectQuery when eager-loading is set.
      id:
        description: |-
          ID of the ent.
          Internal database primary key for foreign key relationships
        type: integer
      name:
        description: Name holds the value of the "name" field.
        type: string
      owner_id:
        description: Project owner user_id, foreign key to users.id
        type: integer
      status:
        description: 'Status: 0-disabled, 1-enabled, 2-archived'
        type: integer
      updated_at:
        description: UpdatedAt holds the value of the "updated_at" field.
        type: string
      uuid:
        description: External UUID for API usage in REST paths
        type: string
    type: object
  ent.ProjectEdges:
    properties:
      members:
        description: Members holds the value of the members edge.
        items:
          $ref: '#/definitions/ent.ProjectMember'
        type: array
      owner:
        allOf:
        - $ref: '#/definitions/ent.User'
        description: Owner holds the value of the owner edge.
    type: object
  ent.ProjectMember:
    properties:
      edges:
        allOf:
        - $ref: '#/definitions/ent.ProjectMemberEdges'
        description: |-
          Edges holds the relations/edges for other nodes in the graph.
          The values are being populated by the ProjectMemberQuery when eager-loading is set.
      id:
        description: ID of the ent.
        type: integer
      joined_at:
        description: JoinedAt holds the value of the "joined_at" field.
        type: string
      project_id:
        description: Foreign key to projects.id
        type: integer
      role:
        description: 'Role: owner, admin, member, viewer'
        type: string
      updated_at:
        description: UpdatedAt holds the value of the "updated_at" field.
        type: string
      user_id:
        description: Foreign key to users.id
        type: integer
    type: object
  ent.ProjectMemberEdges:
    properties:
      project:
        allOf:
        - $ref: '#/definitions/ent.Project'
        description: Project holds the value of the project edge.
      user:
        allOf:
        - $ref: '#/definitions/ent.User'
        description: User holds the value of the user edge.
    type: object
  ent.Servers:
    properties:
      edges:
        allOf:
        - $ref: '#/definitions/ent.ServersEdges'
        description: |-
          Edges holds the relations/edges for other nodes in the graph.
          The values are being populated by the ServersQuery when eager-loading is set.
      id:
        description: ID of the ent.
        type: integer
      ip:
        description: IP holds the value of the "ip" field.
        type: string
      name:
        description: Name holds the value of the "name" field.
        type: string
    type: object
  ent.ServersEdges:
    properties:
      owner:
        allOf:
        - $ref: '#/definitions/ent.User'
        description: Owner holds the value of the owner edge.
    type: object
  ent.User:
    properties:
      avatar:
        description: Avatar URL
        type: string
      created_at:
        description: Account creation timestamp
        type: string
      edges:
        allOf:
        - $ref: '#/definitions/ent.UserEdges'
        description: |-
          Edges holds the relations/edges for other nodes in the graph.
          The values are being populated by the UserQuery when eager-loading is set.
      email:
        description: Email address for login (required, unique)
        type: string
      gender:
        description: 'Gender: 0-Unknown, 1-Male, 2-Female'
        type: integer
      id:
        description: |-
          ID of the ent.
          Internal database primary key (not exposed in API)
        type: integer
      language:
        description: Preferred language (e.g., zh-CN, en-US)
        type: string
      last_login_at:
        description: Last login timestamp
        type: string
      last_login_ip:
        description: Last login IP address (supports IPv6)
        type: string
      nickname:
        description: Display name / nickname
        type: string
      phone:
        description: Phone number
        type: string
      signature:
        description: User signature / bio
        type: string
      status:
        description: 'Account status: 0-Disabled, 1-Active'
        type: integer
      timezone:
        description: User timezone (e.g., Asia/Shanghai)
        type: string
      updated_at:
        description: Last update timestamp
        type: string
      username:
        description: Username for login (optional, alphanumeric + underscore)
        type: string
      uuid:
        description: Public UUID for external API reference (immutable, globally unique)
        type: string
    type: object
  ent.UserEdges:
    properties:
      owned_projects:
        description: OwnedProjects holds the value of the owned_projects edge.
        items:
          $ref: '#/definitions/ent.Project'
        type: array
      project_memberships:
        description: ProjectMemberships holds the value of the project_memberships
          edge.
        items:
          $ref: '#/definitions/ent.ProjectMember'
        type: array
      servers:
        description: Servers holds the value of the servers edge.
        items:
          $ref: '#/definitions/ent.Servers'
        type: array
    type: object
  handler.AddMemberRequest:
    properties:
      role:
        type: string
      user_id:
        type: integer
    required:
    - role
    - user_id
    type: object
  handler.CheckPermissionRequest:
    properties:
      action:
        type: string
      resource:
        type: string
    required:
    - action
    - resource
    type: object
  handler.CheckPermissionResponse:
    properties:
      allowed:
        type: boolean
    type: object
  handler.MemberListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/ent.ProjectMember'
        type: array
      pagination:
        $ref: '#/definitions/response.PaginationInfo'
    type: object
  handler.PermissionItem:
    properties:
      actions:
        items:
          type: string
        type: array
      resource:
        type: string
    type: object
  handler.PermissionsResponse:
    properties:
      permissions:
        items:
          $ref: '#/definitions/handler.PermissionItem'
        type: array
    type: object
  handler.RefreshRequest:
    properties:
      refresh_token:
        example: eyJhbGc...
        type: string
    required:
    - refresh_token
    type: object
  handler.RefreshResponse:
    properties:
      access_token:
        description: New JWT access token
        type: string
      expires_in:
        description: Seconds until access token expires
        type: integer
      refresh_token:
        description: New JWT refresh token
        type: string
    type: object
  handler.UpdateRoleRequest:
    properties:
      role:
        type: string
    required:
    - role
    type: object
  handlers.HealthResponse:
    properties:
      service:
        example: apprun
        type: string
      status:
        example: ok
        type: string
    type: object
  response.ErrorInfo:
    properties:
      code:
        type: string
      details: {}
      message:
        type: string
    type: object
  response.PaginationInfo:
    properties:
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  response.Response:
    properties:
      code:
        type: integer
      data: {}
      error:
        $ref: '#/definitions/response.ErrorInfo'
      message:
        type: string
      request_id:
        type: string
      success:
        type: boolean
    type: object
  service.CreateProjectRequest:
    properties:
      description:
        maxLength: 500
        type: string
      name:
        maxLength: 100
        minLength: 3
        type: string
    required:
    - name
    type: object
  service.LoginRequest:
    properties:
      identifier:
        description: Username or email
        example: user@example.com
        type: string
      password:
        description: Password
        example: SecurePass123
        type: string
    required:
    - identifier
    - password
    type: object
  service.LoginResponse:
    properties:
      access_token:
        description: JWT access token (short-lived)
        type: string
      expires_in:
        description: Seconds until access token expires
        type: integer
      refresh_token:
        description: JWT refresh token (long-lived)
        type: string
      user:
        allOf:
        - $ref: '#/definitions/service.UserProfile'
        description: User profile data
    type: object
  service.ProjectResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      owner_id:
        type: integer
      status:
        type: integer
      updated_at:
        type: string
    type: object
  service.RegisterRequest:
    properties:
      email:
        description: 用户邮箱（必填）
        example: user@example.com
        type: string
      gender:
        description: 性别（可选：0=未知,1=男,2=女）
        example: 1
        type: integer
      language:
        description: 语言（可选）
        example: zh-CN
        type: string
      nickname:
        description: 昵称（可选）
        example: John
        type: string
      password:
        description: 密码（必填，8+字符，含大小写和数字）
        example: SecurePass123
        type: string
      phone:
        description: 手机号（可选）
        example: +86-13800138000
        type: string
      timezone:
        description: 时区（可选）
        example: Asia/Shanghai
        type: string
      username:
        description: 用户名（可选，3-64字符）
        example: john_doe
        type: string
    required:
    - email
    - password
    type: object
  service.RegisterResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        description: Public UUID (exposed as "id" for external API)
        type: string
      nickname:
        type: string
      status:
        type: integer
      username:
        type: string
    type: object
  service.UserProfile:
    properties:
      created_at:
        type: string
      email:
        type: string
      gender:
        type: integer
      id:
        type: string
      language:
        type: string
      nickname:
        type: string
      phone:
        type: string
      status:
        type: integer
      timezone:
        type: string
      username:
        type: string
    type: object
info:
  contact:
    email: support@websoft9.com
    name: API Support
  description: AppRun Platform REST API Documentation
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: AppRun API
  version: "1.0"
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return JWT token
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.LoginResponse'
              type: object
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Account disabled
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.Response'
      summary: User login
      tags:
      - auth
  /api/auth/me:
    get:
      consumes:
      - application/json
      description: Retrieve profile of the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.UserProfile'
              type: object
        "401":
          description: Missing or invalid token
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Get current user profile
      tags:
      - auth
  /api/auth/refresh:
    post:
      consumes:
      - application/json
      description: Exchange refresh token for new access/refresh token pair
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/handler.RefreshResponse'
              type: object
        "400":
          description: Missing or invalid refresh token
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Token expired, invalid type, or blacklisted
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Account disabled
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.Response'
      summary: Refresh access token
      tags:
      - auth
  /api/auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account with email and password
      parameters:
      - description: Registration data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.RegisterResponse'
              type: object
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/response.Response'
        "409":
          description: Email or username already exists
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.Response'
      summary: Register new user
      tags:
      - auth
  /api/config:
    delete:
      consumes:
      - application/json
      description: |-
        Delete a dynamic configuration item from database (config will fallback to file or default value).
        Only dynamic configurations (db:true) can be deleted.
        After deletion, the config will use the value from config files or built-in defaults.
      parameters:
      - description: Configuration key
        example: poc.enabled
        in: query
        name: key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Deletion successful
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Missing key parameter or deletion failed
          schema:
            $ref: '#/definitions/response.Response'
      summary: Delete configuration item
      tags:
      - config
    get:
      consumes:
      - application/json
      description: Query a single configuration item by key, returns value, source
        and dynamic flag
      parameters:
      - description: Configuration key, e.g. app.name
        in: query
        name: key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Configuration retrieved successfully
          schema:
            $ref: '#/definitions/config.GetConfigResponse'
        "400":
          description: Missing key parameter
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Configuration not found
          schema:
            $ref: '#/definitions/response.Response'
      summary: Get configuration item
      tags:
      - config
    put:
      consumes:
      - application/json
      description: |-
        Update a single dynamic configuration item (only for db:true configs).
        Static configurations (db:false) cannot be updated via API.
        Changes are persisted to database and take effect immediately.
      parameters:
      - description: Configuration update request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/config.UpdateConfigRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Configuration updated successfully
          schema:
            $ref: '#/definitions/config.UpdateConfigResponse'
        "400":
          description: Invalid request or config not allowed to store in database
          schema:
            $ref: '#/definitions/response.Response'
      summary: Update configuration item
      tags:
      - config
  /api/config/allowed:
    get:
      consumes:
      - application/json
      description: |-
        Returns all configuration keys marked as db:true (can be modified dynamically via API).
        Use this endpoint to discover which configs can be updated through the API.
        Configs not in this list cannot be modified dynamically.
      produces:
      - application/json
      responses:
        "200":
          description: List of allowed configuration keys
          schema:
            additionalProperties: true
            type: object
      summary: Get allowed configuration keys
      tags:
      - config
  /api/config/list:
    get:
      consumes:
      - application/json
      description: |-
        Returns all dynamic configuration items stored in database.
        This does not include static configurations from files.
        Use this to see which configs have been overridden dynamically.
      produces:
      - application/json
      responses:
        "200":
          description: Configuration list
          schema:
            $ref: '#/definitions/config.ListConfigsResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.Response'
      summary: List dynamic configurations
      tags:
      - config
  /api/demo/i18n:
    get:
      description: Demonstrates internationalization with context-based translation
      parameters:
      - description: Language code (en-US, zh-CN)
        in: query
        name: lang
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  additionalProperties:
                    type: string
                  type: object
              type: object
      summary: i18n Demo
      tags:
      - demo
  /api/projects:
    get:
      description: Lists all projects where the authenticated user is a member
      produces:
      - application/json
      responses:
        "200":
          description: List of projects
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/service.ProjectResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: List user's projects
      tags:
      - Projects
    post:
      consumes:
      - application/json
      description: Creates a new project with the authenticated user as owner
      parameters:
      - description: Project creation data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.CreateProjectRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Project created successfully
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.ProjectResponse'
              type: object
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Create a new project
      tags:
      - Projects
  /api/projects/{id}:
    delete:
      description: Archives a project (soft delete)
      parameters:
      - description: Project UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Project deleted successfully
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Project not found
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Delete project
      tags:
      - Projects
    get:
      description: Gets detailed information about a specific project
      parameters:
      - description: Project UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Project details
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.ProjectResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Project not found
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Get project details
      tags:
      - Projects
    put:
      consumes:
      - application/json
      description: Updates project information (name, description)
      parameters:
      - description: Project UUID
        in: path
        name: id
        required: true
        type: string
      - description: Project update data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service.CreateProjectRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Project updated successfully
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/service.ProjectResponse'
              type: object
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Project not found
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/response.Response'
      security:
      - BearerAuth: []
      summary: Update project
      tags:
      - Projects
  /api/projects/{project_id}/members:
    get:
      description: Get a list of all members in a project
      parameters:
      - description: Project ID
        in: path
        name: project_id
        required: true
        type: integer
      - description: Filter by role
        in: query
        name: role
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/handler.MemberListResponse'
              type: object
        "403":
          description: Forbidden
