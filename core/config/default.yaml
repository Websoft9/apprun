app:
  name: apprun002
  version: "1.0.0"
  timezone: "Asia/Shanghai"  # or "America/New_York", "Europe/London"

# Database configuration
# Environment variables override these values: DATABASE_HOST, DATABASE_PORT, DATABASE_PASSWORD, etc.
database:
  driver: postgres
  host: localhost
  port: 5432
  user: apprun
  password: "dev_password_123"      # Development default, use DATABASE_PASSWORD env var for production
  db_name: apprun_dev
  auto_migrate: false

# Redis/Cache configuration  
# Environment variables override these values: REDIS_HOST, REDIS_PORT, REDIS_PASSWORD, etc.
cache:
  host: localhost
  port: "6379"
  password: ""                      # Optional, use REDIS_PASSWORD env var if needed
  db: 0
  pool_size: 10
  timeout: 2s
  max_retries: 3
  fail_open: true
  tls_enabled: false


logger:
  level: info
  output:
    targets: ["stdout"]

# i18n configuration (internationalization)
i18n:
  default_language: "en-US"
  supported_languages: ["en-US", "zh-CN"]
  translations_path: "./pkg/i18n/testdata"  # Path to translation files

# Authentication configuration (managed by modules/auth/config.go)
# See modules/auth/config.go for full config struct with validation tags
# NOTE: JWT secret and other infrastructure configs are loaded from environment variables
# Set JWT_SECRET environment variable (must be ≥32 characters for security)
# Authentication configuration
# Environment variables override these values: JWT_SECRET (recommended for production)
auth:
  jwt:
    secret: "dev-jwt-secret-must-be-at-least-32-characters-long"  # Development default, use JWT_SECRET env var for production
    access_token_expiration: 24h   # Access token expiration time (db:"true" - updatable)
    refresh_token_expiration: 168h # Refresh token expiration (7 days, for future use)
    issuer: "apprun-platform"      # Token issuer (db:"false" - infrastructure)
    audience: "apprun-api"         # Token audience (db:"false" - infrastructure)
    blacklist_enabled: true        # Enable token blacklist for refresh tokens (requires Redis)
    whitelist_paths:               # Paths that bypass JWT authentication (db:"true" - updatable)
      - /api/auth/register
      - /api/auth/login
      - /api/auth/refresh
      - /health
      - /metrics
  security:
    bcrypt_cost: 10                       # Password hashing cost: 10=balanced, 8=fast, 12=secure (db:"true")
    failed_login_cache_enabled: true      # Cache failed attempts to prevent bcrypt abuse (db:"true")
    failed_login_cache_ttl: 5m            # How long to cache failed attempts (db:"true")
    max_failed_attempts: 5                # Rate limit threshold per user (db:"true")
  
  # Platform initialization configuration (used during bootstrap)
  # If password is empty, a random password will be generated and printed to console
  init:
    username: "admin"                     # Super admin username
    email: "admin@example.com"            # Super admin email (used for login)
    password: ""                          # Leave empty to auto-generate secure password (recommended)
                                          # Or set via INIT_PASSWORD env var for production

# Server configuration (infrastructure, not managed by config center)
# Override via environment variables following naming convention:
# Pattern: {GROUP}_UPPERCASE_{KEY}_UPPERCASE
# Examples: SERVER_HTTP_PORT, SERVER_HTTPS_PORT, SERVER_SSL_CERT_FILE
server:
  http_port: "8080"
  https_port: "8443"
  ssl_cert_file: ""  # Path to SSL certificate (empty = HTTP only)
  ssl_key_file: ""   # Path to SSL private key
  shutdown_timeout: "30s"
  enable_http_with_https: true  # Enable HTTP when HTTPS is active (for health checks)