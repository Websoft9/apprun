app:
  name: apprun002
  version: "1.0.0"
  timezone: "Asia/Shanghai"  # or "America/New_York", "Europe/London"

database:
  driver: postgres
  host: localhost
  port: 5432
  user: apprun
  password: "dev_password_123"
  db_name: apprun_dev
  auto_migrate: false  # Set to true for dev only; production must be false

poc:
  enabled: true
  database: "postgres://user:pass@localhost:5432/apprun_poc"
  apikey: "poc-api-key-123456"

logger:
  level: info
  output:
    targets: ["stdout"]

# i18n configuration (internationalization)
i18n:
  default_language: "en-US"
  supported_languages: ["en-US", "zh-CN"]
  translations_path: "./pkg/i18n/testdata"  # Path to translation files

# Authentication configuration (managed by modules/auth/config.go)
# See modules/auth/config.go for full config struct with validation tags
auth:
  jwt:
    secret: ${JWT_SECRET}  # Must be set via environment variable (≥32 characters, 256 bits)
    access_token_expiration: 24h   # Access token expiration time (db:"true" - updatable)
    refresh_token_expiration: 168h # Refresh token expiration (7 days, for future use)
    issuer: "apprun-platform"      # Token issuer (db:"false" - infrastructure)
    audience: "apprun-api"         # Token audience (db:"false" - infrastructure)
    whitelist_paths:               # Paths that bypass JWT authentication (db:"true" - updatable)
      - /api/v1/auth/register
      - /api/v1/auth/login
      - /health
      - /metrics
  security:
    bcrypt_cost: 10                       # Password hashing cost: 10=balanced, 8=fast, 12=secure (db:"true")
    failed_login_cache_enabled: true      # Cache failed attempts to prevent bcrypt abuse (db:"true")
    failed_login_cache_ttl: 5m            # How long to cache failed attempts (db:"true")
    max_failed_attempts: 5                # Rate limit threshold per user (db:"true")

# Server configuration (infrastructure, not managed by config center)
# Override via environment variables following naming convention:
# Pattern: {GROUP}_UPPERCASE_{KEY}_UPPERCASE
# Examples: SERVER_HTTP_PORT, SERVER_HTTPS_PORT, SERVER_SSL_CERT_FILE
server:
  http_port: "8080"
  https_port: "8443"
  ssl_cert_file: ""  # Path to SSL certificate (empty = HTTP only)
  ssl_key_file: ""   # Path to SSL private key
  shutdown_timeout: "30s"
  enable_http_with_https: true  # Enable HTTP when HTTPS is active (for health checks)