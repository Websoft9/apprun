# Metrics configuration
metrics:
  storage:
    # Backend type: "mock", "badger", or "prometheus"
    backend: mock
    
    # Operation timeout (default: 5s)
    timeout: 5s
    
    # Retry configuration for transient failures
    retry:
      enabled: true
      max_attempts: 3
      backoff: exponential  # "exponential" or "linear"
    
    # BadgerDB-specific settings (used when backend=badger)
    badger:
      path: ./data/metrics.db
      ttl: 24h
      compression: true
    
    # Prometheus-specific settings (used when backend=prometheus)
    prometheus:
      remote_write_url: http://localhost:9090/api/v1/write
      query_url: http://localhost:9090
