# golangci-lint configuration for apprun project
# Compatible with golangci-lint v2.7.2
# Documentation: https://golangci-lint.run/product/config

version: "2"

run:
  timeout: 5m
  tests: true
  build-tags:
    - integration

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - dupl
    - gosec
    - unconvert
    - prealloc
    - gocyclo
    - gocritic
    - errorlint
    - bodyclose

settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
  
  govet:
    enable:
      - all
    disable:
      - shadow
      - fieldalignment
  
  misspell:
    locale: US
  
  dupl:
    threshold: 150
  
  gosec:
    config:
      global:
        nosec: false
        audit: true
  
  staticcheck:
    checks:
      - all
  
  gocyclo:
    min-complexity: 20
  
  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
    disabled-checks:
      - unnamedResult
      - commentFormatting
      - httpNoBody
      - octalLiteral
      - paramTypeCombine
      - equalFold
      - exitAfterDefer

issues:
  exclude-dirs:
    - ent
    - docs
  
  exclude-generated-strict: true
  
  exclude-rules:
    - path: cmd/
      linters:
        - errcheck
    
    - linters:
        - errcheck
      text: "Error return value of.*WithContext"
    
    - linters:
        - errcheck
      text: "Error return value of.*logger\\.Sync"
    
    - linters:
        - gosec
      text: "G302"
    
    - linters:
        - gocritic
      text: "exitAfterDefer"
    
    - path: _test\.go
      linters:
        - dupl
        - gosec
        - errcheck
        - gocyclo
  
  max-issues-per-linter: 50
  max-same-issues: 3
