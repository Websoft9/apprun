# golangci-lint configuration for apprun project
# Compatible with golangci-lint v1.64+
# Documentation: https://golangci-lint.run/usage/configuration/

run:
  timeout: 5m
  tests: true
  build-tags:
    - integration
  modules-download-mode: readonly
  allow-parallel-runners: true

output:
  formats:
    colored-line-number:
      path: stdout
  print-issued-lines: true
  print-linter-name: true
  sort-results: true

linters:
  # Enable default linters + additional checks
  enable:
    # Default (always enabled)
    - errcheck      # 检查未检查的错误
    - govet         # Go vet 静态分析
    - ineffassign   # 检测无效赋值
    - staticcheck   # 静态检查
    - unused        # 检测未使用的代码
    
    # Additional useful linters
    - goconst       # 检测可以常量化的字符串
    - misspell      # 检测拼写错误
    - dupl          # 检测重复代码
    - gosec         # 安全检查
    - unconvert     # 检测不必要的类型转换
    - prealloc      # 检测可以预分配的切片
    - gocognit      # 认知复杂度检查
    - gocyclo       # 圈复杂度检查
    - gocritic      # 综合诊断
    - errorlint     # 错误包装检查
    - bodyclose     # HTTP body close 检查
    
  disable: []

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
  
  govet:
    enable-all: true
    disable:
      - shadow         # 变量阴影在某些情况下是有意的
      - fieldalignment # 结构体字段对齐优化（性能微优化，可读性优先）
  
  goconst:
    min-len: 2
    min-occurrences: 3
  
  misspell:
    locale: US
  
  dupl:
    threshold: 150
  
  gosec:
    excludes:
      - G104  # 未处理错误（errcheck 已覆盖）
      - G302
  
  staticcheck:
    checks: ["all"]
  
  gocognit:
    min-complexity: 40
  
  gocyclo:
    min-complexity: 20  # 从 15 提升到 20（server.Start 函数复杂度 19）
  
  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
    disabled-checks:
      - unnamedResult      # 允许未命名返回值
      - commentFormatting  # 注释格式较宽松
      - httpNoBody         # HTTP 空 body 优化（性能微优化）
      - octalLiteral       # 八进制字面量风格（0644 vs 0o644）
      - paramTypeCombine   # 参数类型合并（代码风格偏好）
      - equalFold          # strings.EqualFold 优化建议（非必须）

issues:
  # 排除生成的代码
  exclude-dirs:
    - ent
    - docs
    - tests/e2e
  
  exclude-files:
    - ".*\\.pb\\.go$"
    - ".*_gen\\.go$"
  
  # 排除特定规则
  exclude-rules:
    # 允许 main 函数中未检查的错误（通常会 panic）
    - path: cmd/
      linters:
        - errcheck
      text: "Error return value"

    # 允许链式调用中的 WithContext 不检查返回值
    - linters:
        - errcheck
      text: "Error return value of.*WithContext.*is not checked"
    
    # 允许 logger.Sync 不检查返回值（defer 中调用）
    - linters:
        - errcheck
      text: "Error return value of.*logger\\.Sync.*is not checked"
    
    # 测试文件中允许忽略 json.Marshal 错误
    - path: _test\.go
      linters:
        - errcheck
      text: "Error return value of.*json\\.Marshal.*is not checked"
    
    # 测试文件使用较宽松的规则
    - path: _test\.go
      linters:
        - dupl
        - gosec
        - goconst
        - gocognit
        - gocyclo
        - funlen

    # 忽略启动失败场景的 exitAfterDefer
    - path: 'cmd/server/main\.go'
      text: 'exitAfterDefer'
      linters:
        - gocritic
  
  # 最大问题数（0 = 无限制）
  max-issues-per-linter: 50
  max-same-issues: 3
  
  # 新代码优先（显示新引入的问题）
  new: false

# Severity settings
severity:
  default-severity: warning
  case-sensitive: false
