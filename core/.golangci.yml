# golangci-lint configuration for apprun project
# Schema Version: v2.7.2
# Documentation: Based on https://golangci-lint.run/jsonschema/golangci.v2.7.jsonschema.json

version: "2"

run:
  timeout: 5m
  tests: true
  build-tags:
    - integration

linters:
  default: "none"
  enable:
    - bodyclose
    - dupl
    - errcheck
    - errorlint
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - misspell
    - prealloc
    - staticcheck
    - unconvert
    - unused

  settings:
    govet:
      enable:
        - nilness
        - shadow
      disable:
        - fieldalignment
    
    gosec:
      excludes:
        - G104
        - G304

    gocyclo:
      min-complexity: 20
      
    dupl:
      threshold: 150
      
    misspell:
      locale: US
      
    errcheck:
      check-type-assertions: true
      check-blank: true

    staticcheck:
      checks: ["all"]

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - unnamedResult
        - commentFormatting
        - httpNoBody
        - octalLiteral
        - paramTypeCombine
        - equalFold
        - exitAfterDefer

  exclusions: 
    generated: strict
    
    paths:
      - "^ent/"
      - "^docs/"

    rules:
      # Exclude cmd/ from errcheck
      - path: "cmd/"
        linters:
          - errcheck
      
      # Specific error suppressions
      - linters:
          - errcheck
        text: "Error return value of.*WithContext"
        
      - linters:
          - errcheck
        text: "Error return value of.*logger\\.Sync"
        
      - linters:
          - errcheck
        text: "Error return value of.*DeleteConfig"
        
      - linters:
          - errcheck
        text: "Error return value of.*Setenv"
        
      - linters:
          - gosec
        text: "G302"
        
      - linters:
          - gocritic
        text: "exitAfterDefer"
        
      # Test file exclusions
      - path: "_test\\.go"
        linters:
          - dupl
          - gosec
          - errcheck
          - gocyclo

issues:
  max-issues-per-linter: 50
  max-same-issues: 3
  uniq-by-line: true