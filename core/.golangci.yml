# golangci-lint configuration for apprun project
# Version: v2.7.2+
# Documentation: https://golangci-lint.run/usage/configuration/

version: '2'

run:
  timeout: 5m
  tests: true
  build-tags:
    - integration
  modules-download-mode: readonly
  allow-parallel-runners: true

output:
  formats:
    colored-line-number:
      path: stdout
  print-issued-lines: true
  print-linter-name: true
  sort-results: true

linters:
  # Enable default linters + additional checks
  enable:
    # Default (always enabled)
    - errcheck      # 检查未检查的错误
    - govet         # Go vet 静态分析
    - ineffassign   # 检测无效赋值
    - staticcheck   # 静态检查
    - unused        # 检测未使用的代码
    
    # Additional useful linters
    - goconst       # 检测可以常量化的字符串
    - misspell      # 检测拼写错误
    - dupl          # 检测重复代码
    - gosec         # 安全检查
    - unconvert     # 检测不必要的类型转换
    - prealloc      # 检测可以预分配的切片
    - gocognit      # 认知复杂度检查
    - gocyclo       # 圈复杂度检查
    - gocritic      # 综合诊断
    - errorlint     # 错误包装检查
    - bodyclose     # HTTP body close 检查
    
  disable: []

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
  
  govet:
    enable-all: true
    disable:
      - shadow  # 变量阴影在某些情况下是有意的
  
  goconst:
    min-len: 2
    min-occurrences: 3
  
  misspell:
    locale: US
  
  dupl:
    threshold: 150
  
  gosec:
    excludes:
      - G104  # 未处理错误（errcheck 已覆盖）
      - G302
  
  staticcheck:
    checks: ["all"]
  
  gocognit:
    min-complexity: 40
  
  gocyclo:
    min-complexity: 15
  
  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
    disabled-checks:
      - unnamedResult  # 允许未命名返回值
      - commentFormatting  # 注释格式较宽松

issues:
  # 排除生成的代码
  exclude-dirs:
    - ent
    - docs
    - tests/e2e
  
  exclude-files:
    - ".*\\.pb\\.go$"
    - ".*_gen\\.go$"
  
  # 排除特定规则
  exclude-rules:
    # 允许 main 函数中未检查的错误（通常会 panic）
    - path: cmd/
      linters:
        - errcheck
      text: "Error return value"

    
    # 测试文件使用较宽松的规则
    - path: _test\.go
      linters:
        - dupl
        - gosec
        - goconst
        - gocognit
        - gocyclo
        - funlen

    # 忽略启动失败场景的 exitAfterDefer
    - path: 'cmd/server/main\.go'
      text: 'exitAfterDefer'
      linters:
        - gocritic
  
  # 最大问题数（0 = 无限制）
  max-issues-per-linter: 50
  max-same-issues: 3
  
  # 新代码优先（显示新引入的问题）
  new: false

# Severity settings
severity:
  default-severity: warning
  case-sensitive: false
