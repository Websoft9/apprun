# Development dependencies only (postgres + redis)
# App runs locally with: go run core/cmd/server/main.go

services:
  postgres:
    image: postgres:15-alpine
    container_name: apprun-postgres-dev
    environment:
      POSTGRES_USER: apprun
      POSTGRES_PASSWORD: dev_password_123
      POSTGRES_DB: apprun_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apprun"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - apprun-dev

  redis:
    image: redis:7-alpine
    container_name: apprun-redis-dev
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - apprun-dev

  prometheus:
    image: prom/prometheus:latest
    container_name: apprun-prometheus-dev
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./docker/config/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./docker/config/prometheus/targets:/etc/prometheus/targets
      - prometheus_dev_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - apprun-dev
    restart: unless-stopped

volumes:
  postgres_dev_data:
  redis_dev_data:
  prometheus_dev_data:

networks:
  apprun-dev:
    driver: bridge
